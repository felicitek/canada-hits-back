<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <filter id="b70" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="b50" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="b34" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="b12" x="-300%" y="-30%" width="700%" height="160%"><feGaussianBlur stdDeviation="12 6"/></filter>
    <linearGradient id="pillar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8123a" stop-opacity="0"/>
      <stop offset=".55" stop-color="#b8123a" stop-opacity=".38"/>
      <stop offset="1" stop-color="#c4163a" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9244f" stop-opacity="0"/>
      <stop offset=".5" stop-color="#df1f4c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f9244f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g id="Aurora red">
    <!-- soft curtains high in the sky -->
    <g filter="url(#b70)">
      <ellipse cx="70" cy="150" rx="210" ry="105" fill="#c8123f" opacity=".38"/>
      <ellipse cx="320" cy="110" rx="170" ry="120" fill="#b81d78" opacity=".34"/>
      <ellipse cx="200" cy="40" rx="210" ry="60" fill="#f9244f" opacity=".2"/>
      <ellipse cx="340" cy="400" rx="170" ry="150" fill="#6e1659" opacity=".38"/>
      <ellipse cx="20" cy="430" rx="150" ry="140" fill="#8d1238" opacity=".34"/>
    </g>
    <!-- long diagonal streaks, like the second photo -->
    <g filter="url(#b34)" opacity=".45">
      <path d="M-30 330 L120 40 L170 60 L40 360 Z" fill="url(#curtain)"/>
      <path d="M170 380 L300 70 L350 90 L240 400 Z" fill="url(#curtain)"/>
    </g>
    <!-- glow rising from the horizon -->
    <g filter="url(#b50)">
      <ellipse cx="195" cy="830" rx="360" ry="190" fill="#b3122f" opacity=".6"/>
      <ellipse cx="120" cy="770" rx="190" ry="120" fill="#8e0f26" opacity=".45"/>
      <ellipse cx="320" cy="740" rx="150" ry="130" fill="#7a0c20" opacity=".5"/>
    </g>
    <!-- light pillars, like the first photo -->
    <g filter="url(#b12)">
      <rect x="62" y="400" width="24" height="440" fill="url(#pillar)" opacity=".55"/>
      <rect x="176" y="360" width="38" height="480" fill="url(#pillar)" opacity=".6"/>
      <rect x="262" y="430" width="22" height="410" fill="url(#pillar)" opacity=".5"/>
      <rect x="328" y="470" width="28" height="370" fill="url(#pillar)" opacity=".4"/>
    </g>
  </g>
  <g id="Ridges">
    <path d="M0 745 L38 722 L70 735 L112 700 L150 728 L196 690 L236 716 L282 694 L322 722 L360 706 L390 724 V844 H0 Z" fill="#0b0206" opacity=".5"/>
    <path d="M0 792 L44 772 L96 788 L150 760 L210 786 L268 762 L330 784 L390 768 V844 H0 Z" fill="#080104" opacity=".78"/>
  </g>
</svg>
